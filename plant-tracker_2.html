<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Watering Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f7f0;
    --surface: #ffffff;
    --surface2: #eef1e8;
    --border: #d6dcc8;
    --border-light: #e8ece0;
    --accent: #3d6b2e;
    --accent-light: #e8f0e0;
    --accent-mid: #5a8f45;
    --text: #1a2214;
    --text-secondary: #4a5c3a;
    --text-muted: #7a8c6a;
    --danger: #c0392b;
    --danger-bg: #fdf0ee;
    --danger-border: #f5c5bf;
    --warn: #9a6200;
    --warn-bg: #fdf5e6;
    --warn-border: #f0d898;
    --ok: #2d6a2d;
    --ok-bg: #edf5ed;
    --ok-border: #b8d8b8;
    --r: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    padding: 1.5rem 1.25rem 1rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 0.9rem;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.7rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .today-label {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .filter-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--accent-mid); color: var(--accent); background: var(--accent-light); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 1rem 1.25rem;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 0.8rem;
    text-align: center;
  }

  .stat-num {
    font-family: 'Fraunces', serif;
    font-size: 1.8rem;
    font-weight: 500;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-num.danger { color: var(--danger); }
  .stat-num.warn { color: var(--warn); }
  .stat-num.ok { color: var(--ok); }

  .stat-label {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .list {
    padding: 1rem 1.25rem 6rem;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .plant-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .plant-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.07); }

  .plant-card.overdue  { border-color: var(--danger-border); background: var(--danger-bg); }
  .plant-card.due-soon { border-color: var(--warn-border);   background: var(--warn-bg);   }
  .plant-card.ok-status{ border-color: var(--ok-border);     background: var(--ok-bg);     }

  .card-main {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
  }

  /* thumbnail */
  .plant-thumb {
    width: 52px;
    height: 52px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .plant-thumb:hover { transform: scale(1.05); }

  .plant-num {
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    font-weight: 300;
    color: var(--text-muted);
    min-width: 20px;
    text-align: right;
    flex-shrink: 0;
  }

  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.overdue  { background: var(--danger); }
  .status-dot.due-soon { background: var(--warn); }
  .status-dot.ok-status{ background: var(--ok); }

  .plant-info { flex: 1; min-width: 0; }

  .plant-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .plant-latin {
    font-size: 11px;
    color: var(--text-muted);
    font-style: italic;
    font-family: 'Fraunces', serif;
    font-weight: 300;
  }

  .plant-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    flex-shrink: 0;
  }

  .days-label {
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .days-label.overdue  { color: var(--danger); }
  .days-label.due-soon { color: var(--warn); }
  .days-label.ok-status{ color: var(--ok); }

  .last-watered {
    font-size: 11px;
    color: var(--text-muted);
  }

  .card-footer {
    border-top: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
  }
  .plant-card.overdue  .card-footer { border-top-color: var(--danger-border); }
  .plant-card.due-soon .card-footer { border-top-color: var(--warn-border); }
  .plant-card.ok-status .card-footer{ border-top-color: var(--ok-border); }

  .freq-label {
    font-size: 11px;
    color: var(--text-secondary);
    flex: 1;
    line-height: 1.4;
  }

  .water-btn {
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .water-btn:hover { background: var(--accent-mid); }
  .water-btn:active { transform: scale(0.96); }
  .water-btn.just-watered { background: var(--ok); }

  /* lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.82);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    padding: 1.5rem;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: min(420px, 90vw);
    max-height: 70vh;
    border-radius: 12px;
    object-fit: contain;
  }
  .lightbox-label {
    color: #fff;
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    font-weight: 300;
    text-align: center;
  }
  .lightbox-close {
    position: absolute;
    top: 18px;
    right: 20px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    font-size: 22px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.25); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 22px;
    border-radius: 30px;
    z-index: 300;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(61,107,46,0.3);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .section-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0 2px;
  }
  .section-divider span {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    font-weight: 500;
  }
  .section-divider::before, .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .plant-card { animation: fadeIn 0.2s ease both; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>🌿 plant water</h1>
    <span class="today-label" id="today-label"></span>
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">all</button>
    <button class="filter-btn" onclick="setFilter('overdue', this)">overdue</button>
    <button class="filter-btn" onclick="setFilter('due-soon', this)">due soon</button>
    <button class="filter-btn" onclick="setFilter('ok-status', this)">ok</button>
  </div>
</header>

<div class="stats-row">
  <div class="stat"><div class="stat-num danger" id="stat-overdue">—</div><div class="stat-label">overdue</div></div>
  <div class="stat"><div class="stat-num warn"   id="stat-soon">—</div><div class="stat-label">due soon</div></div>
  <div class="stat"><div class="stat-num ok"     id="stat-ok">—</div><div class="stat-label">all good</div></div>
</div>

<div class="list" id="plant-list"></div>

<!-- lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-label" id="lightbox-label"></div>
</div>

<div class="toast" id="toast"></div>

function parseDate(str) {
  const [m, d] = str.split('/').map(Number);
  return new Date(2026, m - 1, d);
}
function formatDate(date) { return `${date.getMonth()+1}/${date.getDate()}`; }
function daysUntilDue(lw, freq) {
  return Math.ceil((new Date(lw.getTime() + freq * 86400000) - TODAY) / 86400000);
}

const STORAGE_KEY = 'plant_watered_dates_v1';
function loadDates() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); } catch { return {}; } }
function saveDates(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

let savedDates = loadDates();
let currentFilter = 'all';

function getLastWatered(p) { return savedDates[p.num] || p.lastWatered; }
function getStatus(p) {
  const u = daysUntilDue(parseDate(getLastWatered(p)), p.freqDays);
  return u < 0 ? 'overdue' : u <= 2 ? 'due-soon' : 'ok-status';
}
function getDaysLabel(p) {
  const u = daysUntilDue(parseDate(getLastWatered(p)), p.freqDays);
  if (u < 0) return `${Math.abs(u)}d overdue`;
  if (u === 0) return 'due today';
  if (u === 1) return 'due tomorrow';
  return `${u}d left`;
}

function openLightbox(num, name) {
  document.getElementById('lightbox-img').src = PLANT_IMAGES[num];
  document.getElementById('lightbox-label').textContent = `#${num} · ${name}`;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(e) {
  if (!e || e.target === document.getElementById('lightbox') || e.currentTarget.tagName === 'BUTTON') {
    document.getElementById('lightbox').classList.remove('open');
  }
}

let toastTimeout;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 2200);
}

function waterPlant(num, btn) {
  const date = formatDate(TODAY);
  savedDates[num] = date;
  saveDates(savedDates);
  btn.textContent = '✓ watered';
  btn.classList.add('just-watered');
  showToast(`#${num} watered — ${date}`);
  setTimeout(() => renderList(), 700);
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function updateStats() {
  let o=0, s=0, k=0;
  plants.forEach(p => { const st=getStatus(p); if(st==='overdue') o++; else if(st==='due-soon') s++; else k++; });
  document.getElementById('stat-overdue').textContent = o;
  document.getElementById('stat-soon').textContent = s;
  document.getElementById('stat-ok').textContent = k;
}

function renderList() {
  updateStats();
  const list = document.getElementById('plant-list');
  list.innerHTML = '';
  const filtered = plants.filter(p => currentFilter === 'all' || getStatus(p) === currentFilter);
  if (!filtered.length) {
    list.innerHTML = `<div style="text-align:center;padding:3rem 0;color:var(--text-muted);font-size:13px;">no plants match this filter</div>`;
    return;
  }
  const groups = { overdue:[], 'due-soon':[], 'ok-status':[] };
  filtered.forEach(p => groups[getStatus(p)].push(p));
  const order = currentFilter === 'all' ? ['overdue','due-soon','ok-status'] : [currentFilter];
  const labels = { overdue:'⚠ needs water', 'due-soon':'◎ due soon', 'ok-status':'✓ all good' };

  order.forEach(group => {
    if (!groups[group].length) return;
    if (currentFilter === 'all') {
      const div = document.createElement('div');
      div.className = 'section-divider';
      div.innerHTML = `<span>${labels[group]}</span>`;
      list.appendChild(div);
    }
    groups[group].forEach((plant, i) => {
      const lw = getLastWatered(plant);
      const status = getStatus(plant);
      const card = document.createElement('div');
      card.className = `plant-card ${status}`;
      card.style.animationDelay = `${i * 0.03}s`;
      card.innerHTML = `
        <div class="card-main">
          <div class="plant-num">${plant.num}</div>
          <img class="plant-thumb" src="${PLANT_IMAGES[plant.num]}" alt="${plant.name}"
               onclick="openLightbox(${plant.num}, '${plant.name.replace(/'/g,"\'")}')">
          <div class="status-dot ${status}"></div>
          <div class="plant-info">
            <div class="plant-name">${plant.name}</div>
            <div class="plant-latin">${plant.latin}</div>
          </div>
          <div class="plant-meta">
            <div class="days-label ${status}">${getDaysLabel(plant)}</div>
            <div class="last-watered">last: ${lw}</div>
          </div>
        </div>
        <div class="card-footer">
          <div class="freq-label">every ${plant.freq} · ${plant.tip}</div>
          <button class="water-btn" onclick="waterPlant(${plant.num}, this)">💧 water</button>
        </div>`;
      list.appendChild(card);
    });
  });
}

document.getElementById('today-label').textContent = `today: ${formatDate(TODAY)}`;
renderList();
</script>
</body>
</html>
